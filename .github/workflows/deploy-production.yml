name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and verify production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --dry-run --skip-vault

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --skip-vault --yes

      - name: Deploy application to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
        run: |
          if [ -z "$PRODUCTION_APP_URL" ]; then
            echo "PRODUCTION_APP_URL is required." >&2
            exit 1
          fi

          app_url_b64="$(printf '%s' "$PRODUCTION_APP_URL" | base64 -w 0)"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' APP_URL_B64='$app_url_b64' bash -s" << 'REMOTE'
          set -euo pipefail
          case "$DEPLOY_SHA" in
            *[!0-9a-fA-F]*|"") echo "Invalid revision." >&2; exit 1 ;;
          esac

          production_app_url="$(printf '%s' "$APP_URL_B64" | base64 --decode)"
          if ! canonical_app_url="$(APP_URL_VALUE="$production_app_url" node -e '
            const raw = process.env.APP_URL_VALUE;
            let url;
            try {
              url = new URL(raw);
            } catch {
              process.exit(1);
            }
            if (
              url.protocol !== "https:" ||
              url.username !== "" ||
              url.password !== "" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== ""
            ) {
              process.exit(1);
            }
            process.stdout.write(url.origin);
          ')"; then
            echo "PRODUCTION_APP_URL must be an HTTPS origin." >&2
            exit 1
          fi

          if [ "$canonical_app_url" != "${production_app_url%/}" ]; then
            echo "PRODUCTION_APP_URL must be a canonical HTTPS origin." >&2
            exit 1
          fi

          environment_file=/home/lucrivo/.config/lucrivo.env
          if [ ! -f "$environment_file" ]; then
            echo "Production environment file was not found." >&2
            exit 1
          fi

          environment_tmp="$(mktemp /home/lucrivo/.config/lucrivo.env.XXXXXX)"
          trap 'rm -f "$environment_tmp"' EXIT
          awk -v app_url="$canonical_app_url" '
            /^APP_URL=/ {
              if (!updated) print "APP_URL=" app_url
              updated = 1
              next
            }
            { print }
            END {
              if (!updated) print "APP_URL=" app_url
            }
          ' "$environment_file" > "$environment_tmp"
          chown --reference="$environment_file" "$environment_tmp"
          chmod --reference="$environment_file" "$environment_tmp"
          mv "$environment_tmp" "$environment_file"
          trap - EXIT

          install -d /etc/systemd/system/lucrivo.service.d
          printf '[Service]\nEnvironment=VERCEL_GIT_COMMIT_SHA=%s\n' "$DEPLOY_SHA" \
            > /etc/systemd/system/lucrivo.service.d/revision.conf
          deploy_script=$(mktemp)
          cat > "$deploy_script" << 'DEPLOY'
          #!/bin/bash
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            case "$line" in
              ""|\#*) continue ;;
              *=*) ;;
              *) continue ;;
            esac
            key="${line%%=*}"
            value="${line#*=}"
            export "$key=$value"
          done < /home/lucrivo/.config/lucrivo.env
          cd /home/lucrivo/lucrivo
          git fetch origin
          git checkout --detach "$DEPLOY_SHA"
          pnpm install --frozen-lockfile
          pnpm build
          DEPLOY
          chown lucrivo:lucrivo "$deploy_script"
          chmod 700 "$deploy_script"
          set +e
          sudo -u lucrivo env DEPLOY_SHA="$DEPLOY_SHA" bash "$deploy_script"
          status=$?
          set -e
          rm -f "$deploy_script"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          systemctl daemon-reload
          systemctl restart lucrivo
          REMOTE

      - name: Wait for application revision
        env:
          DEPLOYMENT_URL: ${{ secrets.PRODUCTION_APP_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "PRODUCTION_APP_URL is required." >&2
            exit 1
          fi

          expected_revision="${EXPECTED_REVISION:0:12}"
          deployment_url="${DEPLOYMENT_URL%/}"

          for attempt in {1..60}; do
            if response="$(curl --fail --silent --show-error --max-time 10 "${deployment_url}/api/health")"; then
              revision="$(jq -r 'select(.status == "ok" and .service == "lucrivo") | .revision // empty' <<<"$response")"
              if [ "$revision" = "$expected_revision" ]; then
                echo "Application revision is available."
                exit 0
              fi
            fi

            echo "Waiting for application revision (attempt ${attempt}/60)."
            sleep 10
          done

          echo "Expected application revision was not available in time." >&2
          exit 1

      - name: Validate production signup expectation
        env:
          SIGNUP_EXPECTATION: ${{ vars.PRODUCTION_EXPECT_SIGNUP || 'skip' }}
        run: |
          if [ "$SIGNUP_EXPECTATION" != "skip" ] && [ "$SIGNUP_EXPECTATION" != "disabled" ]; then
            echo "PRODUCTION_EXPECT_SIGNUP must be unset, skip, or disabled." >&2
            exit 1
          fi

      - name: Run production smoke tests
        env:
          DEPLOYMENT_URL: ${{ secrets.PRODUCTION_APP_URL }}
          SIGNUP_EXPECTATION: ${{ vars.PRODUCTION_EXPECT_SIGNUP || 'skip' }}
        run: pnpm smoke:test --base-url "$DEPLOYMENT_URL" --expect-signup "$SIGNUP_EXPECTATION"
